---
- name: Ubuntu 26.04 Desktop Setup - Core Installation - CNPG Lab
  hosts: all
  gather_facts: yes
  vars:
    # Proxy configuration - set these variables if proxy is needed
    use_proxy: false
    proxy_ip: ""
    proxy_port: ""
    # User configuration
    target_user: "{{ ansible_user | default(ansible_facts['env']['USER']) }}"
    target_user_home: "{{ ansible_facts['user_dir'] | default('/home/' + ansible_facts['env']['USER']) }}"
    # Password configuration
    set_user_password: false
    user_password: ""
    # Project configuration
    script_dir: "{{ playbook_dir }}/.."
    homepage_url: "https://github.com/ardentperf-labs/cnpg-playground/blob/lab/ubuntu-26.04/lab/EXERCISES.md#cnpg-lab-exercises"

  tasks:
    - name: Display proxy configuration
      debug:
        msg: "use_proxy={{ use_proxy }}, proxy_ip={{ proxy_ip }}, proxy_port={{ proxy_port }}"

    - name: Display user configuration
      debug:
        msg: "target_user={{ target_user }}, target_user_home={{ target_user_home }}"

    - name: Display password configuration
      debug:
        msg: "set_user_password={{ set_user_password }}, user_password={% if user_password != '' %}SET{% else %}NOT SET{% endif %}"

    - name: Display project configuration
      debug:
        msg: "script_dir={{ script_dir }}, homepage_url={{ homepage_url }}"

    - name: Create Ansible remote temp directory with proper permissions
      file:
        path: "{{ target_user_home }}/.ansible/tmp"
        state: directory
        mode: '0755'

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      become: yes

    - name: Upgrade all packages (less than 5 minutes on fast internet)
      apt:
        upgrade: yes
      become: yes

    - name: Mark the guest as a managed lab desktop
      file:
        path: /etc/desktop-installed-by-cnpg-lab
        state: touch
      become: yes

    - name: Install all required packages (less than 15 minutes on fast internet)
      apt:
        name:
          - ubuntu-desktop-minimal
          - gdm3
          - gnome-remote-desktop
          - openssl
          - gnome-terminal
          - fonts-noto-color-emoji
          - firefox
          - dbus-x11
          - gettext-base
          - python3-passlib
          - docker.io
          - curl
          - ca-certificates
          - git
          - jq
          - kubectx
          - btop
          - bat
          - nano
          - bash-completion
          - python3-yaml
        state: present
      register: package_install
      become: yes

    - name: Set user password if requested
      user:
        name: "{{ target_user }}"
        password: "{{ user_password | password_hash('sha512') }}"
      when: (set_user_password | bool) and user_password != ""
      become: yes
      no_log: true

    - name: Create Docker proxy configuration directory
      file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: '0755'
      when: use_proxy | bool
      become: yes

    - name: Configure Docker proxy settings
      template:
        src: docker-proxy.conf.j2
        dest: /etc/systemd/system/docker.service.d/http-proxy.conf
        mode: '0644'
      when: use_proxy | bool
      notify: restart docker
      become: yes

    - name: Add user to docker group
      user:
        name: "{{ target_user }}"
        groups: docker
        append: yes
      become: yes

    - name: Install pinned Kubernetes and lab tools
      command: bash "{{ playbook_dir }}/install-tools.sh"
      become: yes

    - name: Configure file watch limits for kind
      copy:
        dest: /etc/sysctl.d/99-inotify.conf
        content: |
          fs.inotify.max_user_watches=524288
          fs.inotify.max_user_instances=512
        mode: '0644'
      become: yes

    - name: Apply file watch limits
      command: sysctl --load=/etc/sysctl.d/99-inotify.conf
      changed_when: false
      become: yes

    - name: Enable Docker
      systemd:
        name: docker
        enabled: yes
        state: started
      become: yes

    - name: Generate a private Remote Login password on first install
      shell: umask 077 && openssl rand -hex 24 > "$HOME/.cnpg-rdp-password"
      args:
        creates: "{{ target_user_home }}/.cnpg-rdp-password"

    - name: Configure GNOME Remote Login for the next boot
      command: bash "{{ playbook_dir }}/gnome-remote-login.sh" "{{ target_user }}" "{{ target_user_home }}"
      become: yes

    - name: Create user application directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ target_user_home }}/.local/share/applications"
        - "{{ target_user_home }}/.config/autostart"

    - name: Create Firefox desktop shortcuts
      file:
        src: /var/lib/snapd/desktop/applications/firefox_firefox.desktop
        dest: "{{ item }}"
        state: link
      loop:
        - "{{ target_user_home }}/.local/share/applications/firefox.desktop"
        - "{{ target_user_home }}/.config/autostart/firefox.desktop"

    - name: Create Firefox policies directory
      file:
        path: /etc/firefox/policies
        state: directory
        mode: '0755'
      become: yes

    - name: Configure Firefox policies (system-wide)
      template:
        src: firefox-policies.json.j2
        dest: /etc/firefox/policies/policies.json
        mode: '0644'
      become: yes

    - name: Create configure-desktop script
      template:
        src: configure-desktop.sh.j2
        dest: "{{ target_user_home }}/configure-desktop.sh"
        mode: '0755'

    - name: Create autostart desktop entry
      template:
        src: configure-desktop.desktop.j2
        dest: "{{ target_user_home }}/.config/autostart/configure-desktop.desktop"
        mode: '0644'

    - name: Configure bashrc for KUBECONFIG, aliases and completion
      blockinfile:
        path: "{{ target_user_home }}/.bashrc"
        mode: '0644'
        marker: "# {mark} ANSIBLE MANAGED BLOCK - cnpg-lab configuration"
        block: "{{ lookup('template', 'bashrc.j2') }}"

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted
        daemon_reload: yes
      become: yes