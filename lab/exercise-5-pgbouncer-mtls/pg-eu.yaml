spec:
  # Use cert-manager certificates instead of CNPG's default self-signed certs
  certificates:
    serverTLSSecret: pg-eu-server-cert
    serverCASecret: pg-eu-server-ca
    clientCASecret: pg-eu-client-ca
    replicationTLSSecret: pg-eu-replication-cert

  # Create roles for PgBouncer and application authentication
  managed:
    roles:
      - name: pgbouncer
        login: true
      - name: app
        login: true
        inRoles:
          - pg_write_all_data  # Required for pgbench to create tables

  postgresql:
    # Require certificate authentication and map pgbouncer CN to app role
    pg_hba:
      - hostssl all app all cert map=pooler
      - hostssl all pgbouncer all cert
    pg_ident:
      - pooler pgbouncer app
